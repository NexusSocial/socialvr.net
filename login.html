<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Login with Google</title>
		<script src="https://accounts.google.com/gsi/client" async></script>
		<script src="login.js"></script>
	</head>
	<body>
		<div id="google_credentials">
			<h1>Google Credentials</h1>
			<p>Log into your google account</p>
			<div
				id="g_id_onload"
				data-client_id="526864823942-93igje3cdb5t9hqj7quj93hroklvnbtq.apps.googleusercontent.com"
				data-login_uri="https://did.socialvr.net/oauth2/google"
				data-auto_prompt="false"
				data-callback="handleGoogleLogin"
			></div>
			<div
				class="g_id_signin"
				data-type="standard"
				data-size="large"
				data-theme="outline"
				data-text="sign_in_with"
				data-shape="rectangular"
				data-logo_alignment="left"
			></div>
			<label for="google_client_id">ClientID:</label
			><input
				type="text"
				id="google_client_id"
				value="Sign in First"
				autocomplete="off"
				readonly
			/>
		</div>
		<div id="create_account">
			<h1>Create Account</h1>
			<form action="/action_page.php" method="get">
				<label for="fname">First name:</label>
				<input type="text" id="fname" name="fname" /><br /><br />
				<label for="lname">Last name:</label>
				<input type="text" id="lname" name="lname" /><br /><br />
				<input type="submit" value="Submit" />
			</form>
		</div>
	</body>
</html>
